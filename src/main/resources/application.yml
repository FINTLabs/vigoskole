spring:
  application:
    name: vigoskole
  web:
    locale: nb_NO
  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: false
      media-types:
        jsonld: application/ld+json
  threads:
    virtual:
      enabled: true
  thymeleaf:
    cache: false
    encoding: UTF-8
  security:
    oauth2:
      client:
        registration:
          idporten:
            client-id: ${IDPORTEN_CLIENT_ID:vigoskole}
            client-secret: ${IDPORTEN_CLIENT_SECRET:change-me}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          idporten:
            authorization-uri: ${IDPORTEN_AUTHORIZATION_URI:https://login.idporten.no/authorize}
            token-uri: ${IDPORTEN_TOKEN_URI:https://idporten.no/token}
            user-info-uri: ${IDPORTEN_USERINFO_URI:https://idporten.no/userinfo}
            jwk-set-uri: ${IDPORTEN_JWK_SET_URI:https://idporten.no/jwks.json}
            user-name-attribute: sub
      resourceserver:
        jwt:
          jwk-set-uri: ${MASKINPORTEN_JWK_SET_URI:https://maskinporten.no/jwk}
  servlet:
    encoding:
      force: true
      enabled: true
      charset: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

app:
  maskinporten:
    expected-scope: ${MASKINPORTEN_SCOPE:novari:fakevigoskole}
    jwk-cache-duration: ${MASKINPORTEN_JWK_CACHE_DURATION:PT24H}
  storage-directory: .data/eclipsestore
  submission-windows:
    graduating-students:
      from: 2026-01-02
      to: 2026-05-31
    final-grades:
      from: 2026-05-15
      to: 2026-06-20
    exam-grades:
      from: 2026-06-01
      to: 2026-06-30
  vigo-kodeverk:
    base-url: https://kodeverk.vigo.no
