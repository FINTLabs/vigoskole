<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Feil i innsendingsperiode</title>
    <link rel="stylesheet" th:href="@{/app.css}" />
  </head>
  <body>
    <main class="page stack">
      <section class="topbar">
        <div>
          <h1 class="title">Feil i innsendingsperiode</h1>
          <p class="subtitle">
            Innsendingsperioden kunne ikke lagres. Korriger datoene og prøv på nytt.
          </p>
        </div>
        <span class="muted" th:text="${userDisplayName}">bruker</span>
      </section>

      <section class="card stack">
        <h2>Hva feilet</h2>
        <p th:text="${errorExplanation}">Forklaring på feilen.</p>
        <p><strong>Må korrigeres:</strong> <span th:text="${errorCorrection}">Korrigering.</span></p>
      </section>

      <section class="card stack">
        <h2>Nåværende konfigurert innsendingsperiode</h2>
        <p>
          <strong>Fra:</strong>
          <span th:text="${#temporals.format(submissionWindow.from(), 'dd/MM/yyyy')}">01/01/2026</span>
        </p>
        <p>
          <strong>Til:</strong>
          <span th:text="${#temporals.format(submissionWindow.to(), 'dd/MM/yyyy')}">31/12/2026</span>
        </p>
        <p>
          <a th:href="@{/ui/school-years}">Tilbake til oversikten</a>
        </p>
      </section>
    </main>
  </body>
</html>
