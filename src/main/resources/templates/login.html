<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake Vigo Skole</title>
    <link rel="icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-32x32.png" sizes="32x32">
    <link rel="icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-180x180.png">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="page stack login-page">
    <section class="login-banner">
        <img class="login-banner-logo"
             src="https://novari.no/wp-content/uploads/2024/10/novari_logo_primaer.svg"
             alt="Novari">
        <h1 class="login-banner-title">Fake Vigo Skole</h1>
        <div class="login-banner-spacer" aria-hidden="true"></div>
    </section>

    <section class="login-shell">
        <article class="card stack login-card">
            <div class="stack">
                <h2>Logg inn</h2>
                <p class="subtitle">Innlogging til webapp for inspeksjon av innsendinger og valideringsresultater.</p>
            </div>
            <div class="notice error" th:if="${error}">
                Innlogging feilet. Kontroller brukernavn og passord, eller prøv ID-porten på nytt.
            </div>
            <div class="notice info" th:if="${logout}">
                Du er logget ut av Fake Vigo Skole.
            </div>
            <form class="login-form" th:if="${useFormLogin}" th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Brukernavn
                    <input type="text" name="username" autocomplete="username">
                </label>
                <label>Passord
                    <input type="password" name="password" autocomplete="current-password">
                </label>
                <button type="submit">Logg inn</button>
            </form>
            <div class="stack" th:unless="${useFormLogin}">
                <p>Bruk ID-porten for å få tilgang til webappen.</p>
                <a class="button-link" th:href="${oidcLoginPath}">Logg inn med ID-porten</a>
            </div>
        </article>
    </section>
</main>
</body>
</html>
