<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vigo Skole</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="page stack">
    <section class="topbar">
        <div>
            <h1 class="title">Vigo Skole</h1>
            <p class="subtitle">Inspeksjon av opplastninger og valideringsresultater for avgangselever.</p>
        </div>
        <div class="user-panel">
            <span class="muted" th:text="${userDisplayName}">bruker</span>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Logg ut</button>
            </form>
        </div>
    </section>

    <section class="card stack">
        <h2>Innsendingsperiode</h2>
        <p>
            Nåværende konfigurert periode:
            <strong th:text="${#temporals.format(submissionWindow.from(), 'dd/MM/yyyy')}">01/01/2026</strong>
            til
            <strong th:text="${#temporals.format(submissionWindow.to(), 'dd/MM/yyyy')}">31/12/2026</strong>
        </p>
        <form class="form-grid" th:action="@{/ui/submission-window}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>Fra
                <input type="date" name="from" th:value="${submissionWindow.from()}">
            </label>
            <label>Til
                <input type="date" name="to" th:value="${submissionWindow.to()}">
            </label>
            <button type="submit">Oppdater periode</button>
        </form>
    </section>

    <section class="card" th:if="${!#lists.isEmpty(schoolYears)}">
        <table class="table">
            <thead>
            <tr>
                <th>Skoleår</th>
                <th>Innsendinger</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="schoolYear : ${schoolYears}">
                <td>
                    <a th:href="@{/ui/school-years/{schoolYear}(schoolYear=${schoolYear.schoolYear()})}"
                       th:text="${schoolYear.schoolYear()}">2025-2026</a>
                </td>
                <td th:text="${schoolYear.submissions()}">0</td>
            </tr>
            </tbody>
        </table>
    </section>
    <section class="card" th:if="${#lists.isEmpty(schoolYears)}">
        <h2>Ingen innsendinger ennå</h2>
        <p class="muted">Når API-et mottar opplastninger, blir de tilgjengelige her.</p>
    </section>
</main>
</body>
</html>
