<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${school.name()}">Skole</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="page stack">
    <div class="breadcrumbs">
        <a th:href="@{/ui/school-years}">Skoleår</a>
        <span>/</span>
        <a th:href="@{/ui/school-years/{schoolYear}(schoolYear=${schoolYear})}" th:text="${schoolYear}">2025-2026</a>
        <span>/</span>
        <a th:href="@{/ui/school-years/{schoolYear}/counties/{countyNumber}(schoolYear=${schoolYear},countyNumber=${countyNumber})}"
           th:text="${countyNumber} + ' · ' + ${countyName}">03 · Oslo</a>
        <span>/</span>
        <span th:text="${school.name()}">Skole</span>
    </div>

    <section class="topbar">
        <div>
            <h1 class="title" th:text="${school.name()}">Skole</h1>
            <p class="subtitle" th:text="'Skolenummer ' + ${school.schoolNumber()} + ' · Org.nr ' + ${school.orgNumber()}">Skoleinformasjon</p>
        </div>
        <span class="muted" th:text="${userDisplayName}">bruker</span>
    </section>

    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Tidspunkt</th>
                <th>Status</th>
                <th>Leverandør</th>
                <th>Detaljer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="submission : ${submissions}">
                <td th:text="${#temporals.format(submission.submittedAt().atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yyyy HH:mm')}">16/04/2026 12:00</td>
                <td><span class="badge" th:classappend="${submission.status()}" th:text="${submission.status()}">ACCEPTED</span></td>
                <td th:text="${submission.supplier() == null ? 'Direkte fra skole' : submission.supplier().name()}">Direkte fra skole</td>
                <td><a th:href="@{/ui/submissions/{submissionId}(submissionId=${submission.id()})}">Vis innsending</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
