<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${school.name()}">Skole</title>
    <link rel="icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-32x32.png" sizes="32x32">
    <link rel="icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-180x180.png">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="page stack">
    <div class="breadcrumbs">
        <a th:href="@{/ui/school-years}">Skoleår</a>
        <span>/</span>
        <a th:href="@{/ui/school-years/{schoolYear}(schoolYear=${schoolYear})}" th:text="${schoolYear}">2025-2026</a>
        <span>/</span>
        <a th:href="@{/ui/school-years/{schoolYear}/counties/{countyNumber}(schoolYear=${schoolYear},countyNumber=${countyNumber})}"
           th:text="${countyNumber} + ' · ' + ${countyName}">03 · Oslo</a>
        <span>/</span>
        <span th:text="${school.name()}">Skole</span>
    </div>

    <section class="topbar">
        <div>
            <h1 class="title" th:text="${school.name()}">Skole</h1>
            <p class="subtitle" th:text="'Skolenummer ' + ${school.schoolNumber()} + ' · Org.nr ' + ${school.orgNumber()}">Skoleinformasjon</p>
        </div>
        <span class="muted" th:text="${userDisplayName}">bruker</span>
    </section>

    <section class="card stack">
        <h2>Slett innsendinger for skole</h2>
        <form th:action="@{/ui/school-years/{schoolYear}/counties/{countyNumber}/schools/{orgNumber}/delete(schoolYear=${schoolYear},countyNumber=${countyNumber},orgNumber=${school.orgNumber()})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="danger" type="submit">Slett alle innsendinger for skolen</button>
        </form>
    </section>

    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Tidspunkt</th>
                <th>Type</th>
                <th>Status</th>
                <th>Leverandør</th>
                <th>Detaljer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="submission : ${submissions}">
                <td th:text="${@applicationTimeFormatter.format(submission.submittedAt())}">16/04/2026 12:00</td>
                <td th:text="${submission.type().displayName()}">Liste over avgangselever</td>
                <td><span class="badge" th:classappend="${submission.status()}" th:text="${submission.status()}">ACCEPTED</span></td>
                <td th:text="${submission.supplier() == null ? 'Direkte fra skole' : submission.supplier().name()}">Direkte fra skole</td>
                <td><a th:href="@{/ui/submissions/{submissionId}(submissionId=${submission.id()})}">Vis innsending</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
