<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Vigo Skole - ' + ${schoolYear}">Vigo Skole</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="page stack">
    <div class="breadcrumbs">
        <a th:href="@{/ui/school-years}">Skoleår</a>
        <span>/</span>
        <span th:text="${schoolYear}">2025-2026</span>
    </div>

    <section class="topbar">
        <div>
            <h1 class="title" th:text="${schoolYear}">2025-2026</h1>
            <p class="subtitle">Fylkeskommuner med innsendinger i valgt skoleår.</p>
        </div>
        <span class="muted" th:text="${userDisplayName}">bruker</span>
    </section>

    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Fylkesnr</th>
                <th>Fylkeskommune</th>
                <th>Innsendinger</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="county : ${counties}">
                <td th:text="${county.countyNumber()}">03</td>
                <td>
                    <a th:href="@{/ui/school-years/{schoolYear}/counties/{countyNumber}(schoolYear=${schoolYear},countyNumber=${county.countyNumber()})}"
                       th:text="${county.countyName()}">Oslo</a>
                </td>
                <td th:text="${county.submissions()}">1</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
