<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Fake Vigo Skole - ' + ${schoolYear}">Fake Vigo Skole</title>
    <link rel="icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-32x32.png" sizes="32x32">
    <link rel="icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://novari.no/wp-content/uploads/2024/10/cropped-novari_favicon-180x180.png">
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="page stack">
    <div class="breadcrumbs">
        <a th:href="@{/ui/school-years}">Skoleår</a>
        <span>/</span>
        <span th:text="${schoolYear}">2025-2026</span>
    </div>

    <section class="topbar">
        <div>
            <h1 class="title" th:text="${schoolYear}">2025-2026</h1>
            <p class="subtitle">Fylkeskommuner og innsendinger for valgt skoleår.</p>
        </div>
        <div class="actions">
            <a class="button-link secondary" th:href="@{/ui/school-years/{schoolYear}/edit(schoolYear=${schoolYear})}">Rediger skoleår</a>
            <span class="muted" th:text="${userDisplayName}">bruker</span>
        </div>
    </section>

    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Fylkesnr</th>
                <th>Fylkeskommune</th>
                <th>Innsendinger</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="county : ${counties}">
                <td th:text="${county.countyNumber()}">03</td>
                <td>
                    <a th:href="@{/ui/school-years/{schoolYear}/counties/{countyNumber}(schoolYear=${schoolYear},countyNumber=${county.countyNumber()})}"
                       th:text="${county.countyName()}">Oslo</a>
                </td>
                <td th:text="${county.submissions()}">1</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
