name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew --no-daemon spotlessCheck test
